apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-wss-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        # Run as non-root
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        access_log /var/log/nginx/access.log main;

        sendfile on;
        keepalive_timeout 65;

        # Upstream for idn-node RPC
        upstream idn_rpc {
            server 127.0.0.1:9944;
            keepalive 32;
        }

        # HTTPS server for WSS
        server {
            listen 443 ssl;
            listen [::]:443 ssl;
            http2 off;  # Disable HTTP/2 for WebSocket compatibility

            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            ssl_session_timeout 1d;
            ssl_session_cache shared:SSL:10m;
            ssl_session_tickets off;

            # Health check endpoint (passthrough)
            location /health {
                proxy_pass http://idn_rpc/health;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_connect_timeout 5s;
                proxy_read_timeout 10s;
            }

            # WebSocket proxy for RPC
            location / {
                proxy_pass http://idn_rpc;
                proxy_http_version 1.1;

                # WebSocket upgrade headers
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                # Preserve client info
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # WebSocket specific timeouts
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 3600s;  # 1 hour for long-lived connections

                # Buffer settings for WebSocket
                proxy_buffering off;
                proxy_buffer_size 4k;
            }
        }

        # HTTP server for ACME challenge (cert-manager)
        server {
            listen 80;
            listen [::]:80;

            # ACME challenge path
            location /.well-known/acme-challenge/ {
                root /usr/share/nginx/html;
            }

            # Redirect all other HTTP traffic to HTTPS
            location / {
                return 301 https://$host$request_uri;
            }
        }
    }
