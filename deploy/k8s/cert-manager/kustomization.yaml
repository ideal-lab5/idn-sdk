apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cluster-issuer.yaml
  - gke-autopilot-rbac.yaml

patches:
  # GKE Autopilot: use cert-manager namespace for leader election instead of kube-system
  - target:
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: "--leader-election-namespace=cert-manager"
  - target:
      kind: Deployment
      name: cert-manager-cainjector
      namespace: cert-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: "--leader-election-namespace=cert-manager"
