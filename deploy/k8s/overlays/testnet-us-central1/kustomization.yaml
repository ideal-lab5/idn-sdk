apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idn-testnet

resources:
  - ../../base

namePrefix: testnet-us-

labels:
  - pairs:
      network: testnet
      region: us-central1

patches:
  # Patch parachain chain-spec path (args index 4)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: "/chain-specs/idn-paseo.raw.json"
    target:
      kind: StatefulSet
      name: idn-collator
  # Patch relay chain-spec path (args index 20)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/20
        value: "/chain-specs/paseo.raw.json"
    target:
      kind: StatefulSet
      name: idn-collator
