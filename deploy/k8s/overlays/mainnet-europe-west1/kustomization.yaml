apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idn-mainnet

resources:
  - ../../base

namePrefix: mainnet-eu-

labels:
  - pairs:
      network: mainnet
      region: europe-west1

patches:
  # Patch CHAIN_ID for mainnet
  - patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/env/0/value
        value: "idn"
    target:
      kind: StatefulSet
      name: idn-collator
  # Patch parachain chain-spec path (args index 4)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: "/chain-specs/idn-polkadot.raw.json"
    target:
      kind: StatefulSet
      name: idn-collator
  # Patch relay chain-spec path (args index 19)
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/19
        value: "polkadot"
    target:
      kind: StatefulSet
      name: idn-collator
